# 本地开发基础设施：PostgreSQL + Redis（供 ./dev.sh 使用）
#
# PostgreSQL: postgresql://root:123456@127.0.0.1:5435/new-api
# Redis:      redis://:123456@127.0.0.1:6380/0
#
# 停止: docker compose -f docker-compose.infra.yml stop
# 清数据: docker compose -f docker-compose.infra.yml down -v

services:
  postgres:
    image: postgres:15-alpine
    container_name: new-api-dev-pg
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-root}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-123456}"
      POSTGRES_DB: "${POSTGRES_DB:-new-api}"
    volumes:
      - new_api_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: new-api-dev-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:-123456}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  new_api_pg_data:
