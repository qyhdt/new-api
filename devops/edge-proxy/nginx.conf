include /etc/nginx/runtime/upstreams.conf;

log_format proxy_debug 'time=$time_iso8601 remote=$remote_addr host=$host '
                       'method=$request_method uri="$uri" status=$status '
                       'rt=$request_time upstream="$upstream_addr" '
                       'upstream_status="$upstream_status" upstream_rt="$upstream_response_time"';

access_log /var/log/nginx/proxy.log proxy_debug;
error_log  /var/log/nginx/proxy-error.log warn;

server {
    listen 80 default_server;
    server_name aiapi.thyseed.com aicenter.thyseed.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name aiapi.thyseed.com aicenter.thyseed.com;

    ssl_certificate     /etc/nginx/certs/thyseed/thyseed.com.pem;
    ssl_certificate_key /etc/nginx/certs/thyseed/thyseed.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 64m;

    location / {
        proxy_pass http://$new_api_upstream_host:3000;
        include /etc/nginx/conf.d/proxy_params.inc;

        proxy_connect_timeout 10s;
        proxy_send_timeout    1h;
        proxy_read_timeout    1h;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    server_name www.xiaozhidigital.com xiaozhidigital.com;

    location /.well-known/acme-challenge/ {
        root /etc/nginx/runtime/acme-webroot;
        default_type "text/plain";
    }

    location / {
        return 301 https://www.xiaozhidigital.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.xiaozhidigital.com;

    ssl_certificate     /etc/nginx/runtime/certs-xiaozhi/fullchain.pem;
    ssl_certificate_key /etc/nginx/runtime/certs-xiaozhi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 64m;

    set $vibe_fe vibe-frontend;
    location / {
        proxy_pass http://$vibe_fe:8002;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_connect_timeout 10s;
        proxy_send_timeout    1h;
        proxy_read_timeout    1h;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name xiaozhidigital.com;
    ssl_certificate     /etc/nginx/runtime/certs-xiaozhi/fullchain.pem;
    ssl_certificate_key /etc/nginx/runtime/certs-xiaozhi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://www.xiaozhidigital.com$request_uri;
}
